name: worker-yt-dlp
version: 0.1.0
type: worker
description: "Arbeitspferd yt-dlp: lädt Videos und ihre Metadaten von YouTube und vielen anderen Seiten (yt-dlp[default], JS-Runtime aus worker-deno)"
license: Apache-2.0
requires:
  aios: ">=0.5,<0.6"
depends:
  worker-deno: "~=0.1.0"
worker:
  kind: python
  requirements: worker/requirements.lock
  programs: [yt-dlp]
  check: yt-dlp --version
